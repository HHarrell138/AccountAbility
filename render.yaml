# Render Blueprint: Dashboard -> New -> Blueprint -> pick this repo.
services:
  - type: web
    name: accountability
    runtime: docker
    branch: main         # the live app; work happens on other branches and merges here
    plan: starter        # needed for a persistent disk; free instances wipe the database
    region: ohio
    healthCheckPath: /api/health
    envVars:
      - key: DB_FILE
        value: /var/data/accountability.db
      # Password reset emails, sent from a Gmail account with an app password
      # (see src/mail.js). Set the values in the dashboard; without them,
      # Forgot password can't send anything.
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      # Comma-separated emails with no pact limit (the founder). Set it in
      # the dashboard: this repo is public, so it never goes in here.
      - key: FOUNDER_EMAILS
        sync: false
    disk:
      name: data
      mountPath: /var/data
      sizeGB: 1
